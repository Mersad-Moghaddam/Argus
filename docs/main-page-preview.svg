<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Argus dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#141d3f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121a35"/>
      <stop offset="100%" stop-color="#171f40"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Topbar -->
  <rect x="0" y="0" width="1400" height="76" fill="#0d1226" opacity="0.9"/>
  <rect x="40" y="20" width="36" height="36" rx="10" fill="#5b7cff"/>
  <text x="90" y="38" fill="#eef2ff" font-size="24" font-family="Inter,Arial,sans-serif" font-weight="800">Argus</text>
  <text x="90" y="58" fill="#9fb0d1" font-size="13" font-family="Inter,Arial,sans-serif">Production uptime monitoring control center</text>
  <rect x="1020" y="22" width="150" height="32" rx="8" fill="#171f40" stroke="#232f5c"/>
  <rect x="1180" y="22" width="90" height="32" rx="8" fill="#171f40" stroke="#232f5c"/>
  <rect x="1280" y="22" width="90" height="32" rx="8" fill="#4c6fff"/>

  <!-- Stat cards -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="40" y="100" width="310" height="90" rx="16" fill="url(#card)" stroke="#232f5c"/>
    <circle cx="80" cy="145" r="20" fill="rgba(91,124,255,0.18)"/>
    <text x="115" y="140" fill="#eef2ff" font-size="26" font-weight="700">12</text>
    <text x="115" y="162" fill="#9fb0d1" font-size="13">Total monitors</text>

    <rect x="365" y="100" width="310" height="90" rx="16" fill="url(#card)" stroke="#232f5c"/>
    <circle cx="405" cy="145" r="20" fill="rgba(61,220,151,0.18)"/>
    <text x="440" y="140" fill="#eef2ff" font-size="26" font-weight="700">10</text>
    <text x="440" y="162" fill="#9fb0d1" font-size="13">Currently up</text>

    <rect x="690" y="100" width="310" height="90" rx="16" fill="url(#card)" stroke="#232f5c"/>
    <circle cx="730" cy="145" r="20" fill="rgba(255,100,124,0.18)"/>
    <text x="765" y="140" fill="#eef2ff" font-size="26" font-weight="700">2</text>
    <text x="765" y="162" fill="#9fb0d1" font-size="13">Currently down</text>

    <rect x="1015" y="100" width="345" height="90" rx="16" fill="url(#card)" stroke="#232f5c"/>
    <circle cx="1055" cy="145" r="20" fill="rgba(255,190,92,0.18)"/>
    <text x="1090" y="140" fill="#eef2ff" font-size="26" font-weight="700">1</text>
    <text x="1090" y="162" fill="#9fb0d1" font-size="13">Open incidents</text>
  </g>

  <!-- Tabs -->
  <g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">
    <text x="40" y="232" fill="#5b7cff">Overview</text>
    <rect x="40" y="240" width="86" height="2" fill="#5b7cff"/>
    <text x="150" y="232" fill="#9fb0d1">Monitors</text>
    <text x="255" y="232" fill="#9fb0d1">Incidents</text>
    <text x="360" y="232" fill="#9fb0d1">Alerts &amp; Status Pages</text>
    <text x="560" y="232" fill="#9fb0d1">Ping History</text>
  </g>
  <line x1="40" y1="250" x2="1360" y2="250" stroke="#1b2447"/>

  <!-- Form cards -->
  <rect x="40" y="270" width="425" height="230" rx="16" fill="url(#card)" stroke="#232f5c"/>
  <text x="65" y="308" fill="#eef2ff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">+ Add monitor</text>
  <rect x="65" y="325" width="375" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="65" y="373" width="180" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="260" y="373" width="180" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="65" y="421" width="375" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="65" y="469" width="150" height="34" rx="8" fill="#4c6fff"/>

  <rect x="487" y="270" width="425" height="230" rx="16" fill="url(#card)" stroke="#232f5c"/>
  <text x="512" y="308" fill="#eef2ff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">+ Add alert channel</text>
  <rect x="512" y="325" width="375" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="512" y="373" width="375" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="512" y="421" width="375" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="512" y="469" width="160" height="34" rx="8" fill="#4c6fff"/>

  <rect x="934" y="270" width="426" height="230" rx="16" fill="url(#card)" stroke="#232f5c"/>
  <text x="959" y="308" fill="#eef2ff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">+ Create status page</text>
  <rect x="959" y="325" width="376" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="959" y="373" width="376" height="38" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <rect x="959" y="469" width="190" height="34" rx="8" fill="#4c6fff"/>

  <!-- Incidents card -->
  <rect x="40" y="520" width="1320" height="150" rx="16" fill="url(#card)" stroke="#232f5c"/>
  <text x="65" y="558" fill="#eef2ff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">Recent incidents</text>
  <rect x="65" y="575" width="1270" height="40" rx="10" fill="#171f40" stroke="#1b2447"/>
  <rect x="65" y="622" width="1270" height="40" rx="10" fill="#171f40" stroke="#1b2447"/>

  <!-- Table card -->
  <rect x="40" y="690" width="1320" height="180" rx="16" fill="url(#card)" stroke="#232f5c"/>
  <text x="65" y="728" fill="#eef2ff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">Current status</text>
  <rect x="1150" y="705" width="185" height="32" rx="8" fill="#0f1530" stroke="#2b3b6c"/>
  <line x1="65" y1="745" x2="1335" y2="745" stroke="#1b2447"/>
  <text x="65" y="775" fill="#6c7aa3" font-size="12" font-family="Inter,Arial,sans-serif" letter-spacing="1">ID   URL   TYPE   INTERVAL   STATUS   LAST CODE   ACTIONS</text>
  <rect x="65" y="790" width="1270" height="1" fill="#1b2447"/>
  <circle cx="600" cy="815" r="4" fill="#3ddc97"/>
  <text x="612" y="820" fill="#3ddc97" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700">up</text>
  <rect x="65" y="835" width="1270" height="1" fill="#1b2447"/>
  <circle cx="600" cy="850" r="4" fill="#ff647c"/>
  <text x="612" y="855" fill="#ff647c" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700">down</text>
</svg>
