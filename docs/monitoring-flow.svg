<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Argus monitoring flow</title>
  <desc id="desc">Checks move from the scheduler to workers, durable history, incident policy, and alert delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11162a"/><stop offset="1" stop-color="#092027"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#242035"/><stop offset="1" stop-color="#121927"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d2764c"/><stop offset=".5" stop-color="#e8c864"/><stop offset="1" stop-color="#51b9ad"/>
    </linearGradient>
    <pattern id="key" width="42" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 1h27v7H10V5h11M42 11H15V4h17v3H21" fill="none" stroke="#d0834b" stroke-width="1.5"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .packet{animation:move 4.5s linear infinite}
      .p2{animation-delay:1.5s}.p3{animation-delay:3s}
      .lamp{animation:blink 2.2s ease-in-out infinite}
      @keyframes move{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(792px);opacity:0}}
      @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.packet,.lamp{animation:none}}
    </style>
  </defs>
  <rect width="1100" height="250" rx="20" fill="url(#bg)"/>
  <rect x="25" y="16" width="1050" height="12" fill="url(#key)" opacity=".65"/>
  <path d="M153 119H945" stroke="#33505a" stroke-width="2"/>
  <path d="M153 119H945" stroke="url(#line)" stroke-width="2" stroke-dasharray="3 12" opacity=".55"/>
  <g class="packet" transform="translate(153 119)">
    <circle r="7" fill="#55edc4" opacity=".2" filter="url(#soft)"/><circle r="3.5" fill="#74ffd8"/>
  </g>
  <g class="packet p2" transform="translate(153 119)">
    <circle r="7" fill="#55edc4" opacity=".2" filter="url(#soft)"/><circle r="3.5" fill="#74ffd8"/>
  </g>
  <g class="packet p3" transform="translate(153 119)">
    <circle r="7" fill="#55edc4" opacity=".2" filter="url(#soft)"/><circle r="3.5" fill="#74ffd8"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(116 119)">
      <rect x="-82" y="-48" width="164" height="96" rx="14" fill="url(#panel)" stroke="#986048"/>
      <circle class="lamp" cx="0" cy="-15" r="8" fill="#63efc7"/>
      <text y="15" fill="#f3e6c2" font-family="Georgia,serif" font-size="17" font-weight="700">Scheduler</text>
      <text y="35" fill="#79938e" font-size="11">find due monitors</text>
    </g>
    <g transform="translate(332 119)">
      <rect x="-82" y="-48" width="164" height="96" rx="14" fill="url(#panel)" stroke="#986048"/>
      <path d="M-13-21h26M-9-27h18M-17-15h34" stroke="#63efc7" stroke-width="3" stroke-linecap="round"/>
      <text y="15" fill="#f3e6c2" font-family="Georgia,serif" font-size="17" font-weight="700">Asynq workers</text>
      <text y="35" fill="#79938e" font-size="11">evaluate + dedupe</text>
    </g>
    <g transform="translate(548 119)">
      <rect x="-82" y="-48" width="164" height="96" rx="14" fill="url(#panel)" stroke="#986048"/>
      <ellipse cy="-22" rx="16" ry="6" fill="none" stroke="#63efc7" stroke-width="2"/>
      <path d="M-16-22v16c0 8 32 8 32 0v-16M-16-14c0 8 32 8 32 0" fill="none" stroke="#63efc7" stroke-width="2"/>
      <text y="15" fill="#f3e6c2" font-family="Georgia,serif" font-size="17" font-weight="700">MySQL history</text>
      <text y="35" fill="#79938e" font-size="11">checks + state</text>
    </g>
    <g transform="translate(764 119)">
      <rect x="-82" y="-48" width="164" height="96" rx="14" fill="url(#panel)" stroke="#986048"/>
      <path d="M0-29l18 31H-18Z" fill="none" stroke="#f2c75c" stroke-width="2"/>
      <path d="M0-18v10M0-3v2" stroke="#f2c75c" stroke-width="2" stroke-linecap="round"/>
      <text y="15" fill="#f3e6c2" font-family="Georgia,serif" font-size="17" font-weight="700">Incident policy</text>
      <text y="35" fill="#79938e" font-size="11">open or resolve</text>
    </g>
    <g transform="translate(980 119)">
      <rect x="-82" y="-48" width="164" height="96" rx="14" fill="url(#panel)" stroke="#986048"/>
      <path d="M-17-24h34v24h-34zM-17-24L0-11l17-13" fill="none" stroke="#4bb4ed" stroke-width="2"/>
      <text y="15" fill="#f3e6c2" font-family="Georgia,serif" font-size="17" font-weight="700">Outbox alerts</text>
      <text y="35" fill="#79938e" font-size="11">webhook + Slack</text>
    </g>
    <text x="550" y="220" fill="#bd9265" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">THE GOLDEN THREAD · FROM CHECK TO RESPONSE</text>
  </g>
  <rect x=".75" y=".75" width="1098.5" height="248.5" rx="19.25" fill="none" stroke="#b95d41" stroke-opacity=".75" stroke-width="1.5"/>
</svg>
