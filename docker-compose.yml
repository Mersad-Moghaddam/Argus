version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: argus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: argus
      MYSQL_USER: argus
      MYSQL_PASSWORD: argus
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migrations/0002_outbox.up.sql:/docker-entrypoint-initdb.d/02-outbox.sql:ro

  redis:
    image: redis:8.8-alpine
    container_name: argus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    container_name: argus-victoriametrics
    restart: unless-stopped
    command:
      - -httpListenAddr=:8428
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -memory.allowedPercent=60
      - -storage.minFreeDiskSpaceBytes=5GB
    # The query endpoint is bound to loopback for local development. Production
    # deployments keep it on the private Compose network and query it only via
    # the Argus service, which enforces project scope before forming PromQL.
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 1g

volumes:
  mysql_data:
  redis_data:
  victoriametrics_data:
